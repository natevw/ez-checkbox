name: mitm
services:
  proxy:
    image: docker.io/mitmproxy/mitmproxy
    restart: unless-stopped
    ports:
      - "5353:5353/udp"
      - "8080:8080/tcp"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data:/home/mitmproxy/.mitmproxy
    env_file: proxy.env
    tty: true  # ~WORKAROUND: doesn't seem to log without this…?
    command: >
      mitmweb
      --no-web-open-browser
      --web-host 0.0.0.0
      --web-port 8081
      --set web_password=4
      -s /home/mitmproxy/.mitmproxy/custom-dns.py
      --mode regular@8080
      --mode dns@5353
